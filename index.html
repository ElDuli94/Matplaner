  <style>
    /* Lasteskjerm (inline så den vises umiddelbart) */
    #splash {
      position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 28px;
      background: radial-gradient(120% 90% at 50% 30%, #3f9a6a 0%, #1f5e3f 55%, #123b28 100%);
      color: #fff; overflow: hidden; perspective: 900px;
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease, transform .5s ease, visibility .5s;
    }
    #splash.hide { opacity: 0; transform: scale(1.08); visibility: hidden; pointer-events: none; }
    #splash::before { /* lysflekk */
      content: ""; position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: conic-gradient(from 0deg, transparent 0 20%, rgba(255,255,255,.07) 25%, transparent 30% 70%, rgba(255,255,255,.06) 75%, transparent 80%);
      animation: sp-rays 14s linear infinite;
    }
    .sp-stage { position: relative; width: 180px; height: 180px; transform-style: preserve-3d; }
    .sp-tile {
      position: absolute; inset: 0; transform-style: preserve-3d;
      animation: sp-enter 1.3s cubic-bezier(.2,.85,.25,1.1) both, sp-float 3.2s ease-in-out 1.3s infinite alternate;
    }
    .sp-layer { position: absolute; inset: 0; border-radius: 42px; background: #164a31; }
    .sp-front { position: absolute; inset: 0; transform: translateZ(16px); }
    .sp-front img { width: 100%; height: 100%; display: block; border-radius: 42px; }
    .sp-gloss { /* glans som sveiper over */
      position: absolute; inset: 0; border-radius: 42px; transform: translateZ(18px); pointer-events: none;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.5) 45%, transparent 60%) no-repeat;
      background-size: 300% 100%; background-position: 120% 0;
      animation: sp-shine 1.1s ease 1.1s both;
    }
    .sp-back { position: absolute; inset: 0; border-radius: 42px; transform: translateZ(-14px) rotateY(180deg); box-shadow: 0 30px 60px rgba(0,0,0,.35);
      background: linear-gradient(135deg, #2f7d55, #164a31); }
    .sp-orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d;
      transform: rotateX(72deg); animation: sp-orbit-in .6s ease .7s both; }
    .sp-item { position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; font-size: 28px; line-height: 36px; text-align: center;
      opacity: 0; animation: sp-orb 7s linear infinite, sp-fade .6s ease .8s both; text-shadow: 0 6px 10px rgba(0,0,0,.35); }
    .sp-word { text-align: center; }
    .sp-name { font-size: 40px; font-weight: 800; letter-spacing: -.02em; display: flex; justify-content: center; }
    .sp-name span { display: inline-block; opacity: 0; transform: translateY(24px) rotateX(-90deg); transform-origin: 50% 100%;
      animation: sp-letter .6s cubic-bezier(.2,.9,.3,1.2) both; text-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .sp-sub { margin-top: 6px; font-size: 14px; font-weight: 700; letter-spacing: .55em; padding-left: .55em; opacity: 0;
      color: #ffd2a8; animation: sp-fade .6s ease 1.5s both; }
    .sp-bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; opacity: 0; animation: sp-fade .4s ease 1.2s both; }
    .sp-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: inherit; background: #ffb070; animation: sp-load 1.1s ease-in-out infinite; }
    @keyframes sp-enter { from { transform: translateZ(-600px) rotateX(70deg) rotateY(-300deg) scale(.2); }
      to { transform: rotateX(8deg) rotateY(-18deg); } }
    @keyframes sp-float { from { transform: rotateX(8deg) rotateY(-18deg) translateY(0); } to { transform: rotateX(-6deg) rotateY(18deg) translateY(-10px); } }
    @keyframes sp-shine { to { background-position: -40% 0; } }
    @keyframes sp-orb { from { transform: rotateZ(0deg) translateY(-150px) rotateZ(0deg) rotateX(-72deg); }
      to { transform: rotateZ(360deg) translateY(-150px) rotateZ(-360deg) rotateX(-72deg); } }
    @keyframes sp-orbit-in { from { transform: rotateX(72deg) scale(.3); } to { transform: rotateX(72deg) scale(1); } }
    @keyframes sp-letter { to { opacity: 1; transform: none; } }
    @keyframes sp-fade { to { opacity: 1; } }
    @keyframes sp-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes sp-rays { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash::before { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    }
  </style>
